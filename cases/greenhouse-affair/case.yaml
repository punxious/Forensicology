# The Greenhouse Affair
#
# Source file for a Forensicology case. Answers here are plaintext; the build
# step (`pnpm case:build`) validates this file, hashes every answer and emits a
# server-only bundle. See README.md → "Writing a case".

slug: greenhouse-affair
version: 1
title: The Greenhouse Affair
tagline: A botanist collapses inside her locked glasshouse. The police say accident. The evidence disagrees.
difficulty: 2
durationMinutes: 60
players: { min: 1, max: 6 }
free: true
briefing: documents/briefing.md
epilogue: documents/epilogue.md

