  - id: floor-plan
    kind: image
    title: Glasshouse Floor Plan
    tag: EV-02
    summary: Scene sketch of the Victoria Glasshouse, with bed numbers.
    initial: true
    image: assets/floor-plan.svg
    imageAlt: >-
      Floor plan of the Victoria Glasshouse. The single door with a keypad is on the south wall, roof vents
      run along the centre. Beds along the west wall, north to south: Bed 1 Asplenium fennimorense
      (Fennimore fern), Bed 2 Salvia, Bed 3 Digitalis purpurea (foxglove). Centre beds: Bed 4 Aloysia
      citrodora (lemon verbena), Bed 5 seed trays, Bed 6 orchids. East wall: Bed 7 Nerium oleander,
      Bed 8 citrus, Bed 9 tree ferns. The potting bench sits by the door; a flask (marked A) and an
      uncapped Thornguard canister (marked B) are on it. A cross between beds 4 and 5 marks where
      Dr Marchetti was found. The chemical store cupboard is in the south-east corner.
