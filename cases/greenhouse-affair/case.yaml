puzzles:
  - id: desk-drawer
    type: lock
    title: The Locked Desk Drawer
    prompt: |
      Dr Marchetti's desk drawer was sent to the lab still locked. It has a four-digit keypad, and
      nobody at the Trust knows the code. She must have written it down somewhere.
    config: { variant: keypad, length: 4, label: "Desk drawer keypad" }
    uses: [notebook, incident-report]
    unlocks: { evidence: [access-log, drawer-note, phone-records, library-log] }
    answer: "6092"
    hints:
      - Botanists sometimes label specimens with ink that only shows under ultraviolet light. Try the UV torch on her papers.
      - Her notebook has a hidden line about the drawer. It refers to a code you can find in the incident report.
      - The door code in the incident report is 2906. "Read it in the mirror" means reverse it.
    solvedText: |
      The drawer clicks open. Inside: a printout of the glasshouse door log, a sticky note, and a
      folder where DS Nandakumar has dropped the phone and library records you asked for.

  - id: timeline
    type: timeline
    title: Reconstruct the Timeline
    prompt: |
      Put these events in the order they really happened, earliest first. Every clock on this case
      was checked against local time except one.
    requires: [desk-drawer]
    uses: [access-log, phone-records, library-log, greenhouse-diary, rail-ticket, incident-report]
    unlocks: { evidence: [statement-wren, statement-hollis, statement-felix, statement-abe] }
    config:
      cards:
        - { id: t-felix-visit, source: Keypad log, stamp: "THU 13 JUN 10:20", text: "Door opened with the shared code." }
        - { id: t-door-in, source: Keypad log, stamp: "FRI 14 JUN 16:07", text: "Door opened with the shared code." }
        - { id: t-call, source: Phone records, stamp: "Fri 16:58", text: "Odile calls Wren Talbot. Call lasts 2 min 10 s." }
        - { id: t-lib-exit, source: Library badge reader, stamp: "Fri 17:02", text: "W. TALBOT badges out of the library." }
        - { id: t-pruning, source: Work diary, stamp: "Wed 12 Jun", text: "Bed 7 (oleander) pruned, cuttings bagged — W.T." }
        - { id: t-door-out, source: Keypad log, stamp: "FRI 14 JUN 16:16", text: "Door opened from inside (push bar)." }
        - { id: t-train, source: Rail ticket, stamp: "Fri 15:52", text: "Felix Marchetti's train leaves Ashcombe Vale for Kingsmere." }
        - { id: t-lib-entry, source: Library badge reader, stamp: "Fri 17:29", text: "W. TALBOT badges back into the library." }
        - { id: t-sms, source: H. Crane's phone, stamp: "Fri 17:42", text: "Text from Odile: 'Feeling very odd, heart all over the place.'" }
    answer: [t-pruning, t-felix-visit, t-train, t-call, t-lib-exit, t-door-in, t-door-out, t-lib-entry, t-sms]
    hints:
      - Do all the clocks agree? Compare one event that appears in two different sources.
      - The incident report says Abe found her at 18:40. Find his entry in the keypad log and compare.
      - The keypad clock is one hour behind. 16:07 on the keypad is really 17:07, just after Wren left the library.
    solvedText: |
      Corrected for the keypad's clock, the picture is stark: Odile phones Wren at 16:58. Four minutes
      later Wren leaves the library. Someone opens the glasshouse door at 17:07 and leaves at 17:16.
      Wren is back at her desk by 17:29. DS Nandakumar sends over the witness statements.

  - id: statements
    type: statements
    title: Flag the Contradictions
    prompt: |
      Read the four statements. Flag the **three** lines that are contradicted by evidence you already
      hold or by another witness.
    requires: [timeline]
    uses: [phone-records, library-log]
    unlocks: { evidence: [council-minutes] }
    config:
      transcripts: [statement-wren, statement-hollis, statement-felix, statement-abe]
      flagCount: 3
    answer: [wren-4, wren-5, felix-1]
    hints:
      - Check each claim about times and contact against the phone records and library log. Then check the witnesses against each other.
      - Two of the lies belong to the same person. The third is someone hiding a recent visit.
      - "Wren says she didn't hear from Odile (the phone records show a call) and that she never left the library (the badge log disagrees). Felix says he hadn't seen Odile in two years, but Abe saw them together on Thursday."
    solvedText: |
      Wren Talbot lied twice about Friday afternoon. Felix lied about Thursday, which would explain
      his prints on the door handle. The council sends over its minutes to check the Director's account.

  - id: alibis
    type: board
    title: The Alibi Board
    prompt: |
      Pin each suspect to the **one** document that settles where they were between 17:00 and 17:20
      on Friday. Connect three strings. Two documents are decoys.
    requires: [statements]
    uses: [council-minutes, rail-ticket, library-log]
    config:
      nodes:
        - { id: n-wren, label: Wren Talbot, group: left, note: Research assistant }
        - { id: n-hollis, label: Hollis Crane, group: left, note: Director }
        - { id: n-felix, label: Felix Marchetti, group: left, note: Nephew }
        - { id: n-library, label: Library access log, group: right, evidence: library-log }
        - { id: n-minutes, label: Committee minutes, group: right, evidence: council-minutes }
        - { id: n-ticket, label: Rail ticket and receipt, group: right, evidence: rail-ticket }
        - { id: n-phone, label: Phone records, group: right, evidence: phone-records }
        - { id: n-diary, label: Work diary, group: right, evidence: greenhouse-diary }
    answer: [[n-wren, n-library], [n-hollis, n-minutes], [n-felix, n-ticket]]
    hints:
      - Phone records say who called whom, not where they were. The diary doesn't cover Friday afternoon.
      - Each suspect has exactly one document that puts them somewhere at around five o'clock.
      - Wren goes to the library log, Hollis to the committee minutes, Felix to the rail ticket and café receipt.
    solvedText: |
      Hollis Crane was addressing the planning committee at 17:05. Felix Marchetti was buying tea in
      Kingsmere, forty miles away, at 17:20. Wren Talbot is the only one with half an hour unaccounted for.

  - id: lab
    type: lab
    title: Toxicology Bench
    prompt: |
      The post-mortem notes a slow, irregular heartbeat and nausea. Pupils were normal. The police
      think she breathed in organophosphate pesticide. Run tests until you can tell the coroner
      **what poisoned her and how it reached her**.
    requires: [statements]
    uses: [floor-plan, incident-report]
    unlocks: { evidence: [tox-report, latent-flask, card-wren, card-felix, card-hollis, card-odile] }
    config:
      processingSeconds: 4
      samples:
        - { id: blood, label: Post-mortem blood, description: Femoral blood sample, sealed AV-0614-B1. }
        - { id: flask, label: Flask residue, description: Liquid residue from the steel flask (item A). }
        - { id: canister, label: Canister swab, description: Swab from the Thornguard canister nozzle (item B). }
        - { id: leaves, label: Leaf fragments, description: Green fragments swept from the potting bench. }
      tests:
        - { id: op, label: Organophosphate screen, description: Cholinesterase inhibition assay. }
        - { id: glycoside, label: Cardiac glycoside screen, description: Immunoassay with LC-MS confirmation. }
        - { id: microscopy, label: Plant tissue microscopy, description: Leaf structure under the microscope. }
    results:
      "blood|op": |
        **ORGANOPHOSPHATE SCREEN — NEGATIVE.** Cholinesterase activity is in the normal range. Not
        consistent with organophosphate exposure.
      "blood|glycoside": |
        **CARDIAC GLYCOSIDE SCREEN — POSITIVE.** Oleandrin present at a level consistent with heart
        toxicity. Source not determined. Suggest testing food and drink.
      "flask|op": |
        **ORGANOPHOSPHATE SCREEN — NEGATIVE.** No pesticide residue in the flask.
      "flask|glycoside": |
        **CARDIAC GLYCOSIDE SCREEN — POSITIVE.** Oleandrin at a high concentration in the lemon
        verbena tea. Confirmed by LC-MS. This is the source.
      "flask|microscopy": |
        **MICROSCOPY.** Fine plant fragments suspended in the tea. Too damaged to identify. Recommend a
        chemical screen.
      "canister|op": |
        **ORGANOPHOSPHATE SCREEN — POSITIVE.** As expected: Thornguard is an organophosphate. The
        nozzle is dry, with no sign of recent spraying.
      "canister|glycoside": "**CARDIAC GLYCOSIDE SCREEN — NEGATIVE.**"
      "leaves|op": "**ORGANOPHOSPHATE SCREEN — NEGATIVE.**"
      "leaves|glycoside": |
        **CARDIAC GLYCOSIDE SCREEN — POSITIVE.** Oleandrin is present, as it naturally is in this plant.
      "leaves|microscopy": |
        **MICROSCOPY.** Narrow, leathery leaf. The stomata (breathing pores) sit in hairy pits on the
        underside. This is the textbook structure of *Nerium oleander*. Not foxglove.
      "blood|microscopy": "**NOT APPLICABLE.** Microscopy is for plant tissue."
      default: "**NO RESULT OF SIGNIFICANCE.**"
    answer: { sample: flask, test: glycoside }
    hints:
      - Normal pupils and a slow, irregular heart don't fit pesticide poisoning. Which test fits those symptoms?
      - A positive blood result tells you what poisoned her, but not how it got to her. What did she drink all afternoon?
      - Run the cardiac glycoside screen on the flask residue.
    solvedText: |
      Oleandrin, a heart poison from the oleander plant, was in her tea. The Thornguard canister was
      staged. The lab releases the full toxicology report, a latent print lifted from the flask lid,
      and the elimination print cards.

  - id: fingerprint
    type: fingerprint
    title: The Print on the Flask Lid
    prompt: |
      Whoever poisoned the tea unscrewed the flask lid. Mark at least **six** ridge features on the
      latent lift, then decide which print card it matches. Watch the feature *types* as well as their
      positions.
    requires: [lab]
    unlocks: { evidence: [locker-search] }
    config:
      latent: latent-flask
      cards: [card-wren, card-felix, card-hollis, card-odile]
      minMarks: 6
    answer: card-wren
    hints:
      - Start with the overall pattern. Two of the four cards aren't even the same pattern type as the latent.
      - Felix's card shares many positions with the latent, but compare the types at C3 and D4 carefully.
      - Every feature on the latent matches Wren Talbot's card exactly, type and position.
    solvedText: |
      Eight points of agreement with no differences. The print on the flask lid is Wren Talbot's,
      on a flask she said she never touched. A warrant is issued for her staff locker.

  - id: journal
    type: lock
    title: Odile's Journal
    prompt: |
      Odile's leather journal has a six-letter word lock. The note from her drawer tells you how she
      chose the word.
    requires: [lab]
    uses: [drawer-note, floor-plan]
    unlocks: { evidence: [journal] }
    config: { variant: word, length: 6, label: "Journal word lock" }
    answer: NERIUM
    hints:
      - The note mentions a bed number. The floor plan tells you what grows there.
      - A plant's scientific name has two parts. The first part is the genus.
      - Bed 7 is Nerium oleander. The genus is NERIUM.
    solvedText: |
      The clasp springs open. The last three entries tell you what Odile knew, and who knew she knew.

  - id: accusation
    type: accusation
    title: Final Accusation
    prompt: |
      The coroner's call is about to start. Name the culprit, the motive and the method. All three
      must be right for the case to stand.
    requires: [alibis, fingerprint, journal]
    config:
      suspects:
        - { id: wren, label: Wren Talbot }
        - { id: hollis, label: Hollis Crane }
        - { id: felix, label: Felix Marchetti }
      motives:
        - { id: cottage, label: To inherit her cottage }
        - { id: meadow, label: To push through the east meadow sale }
        - { id: data, label: To stop her exposing falsified research data }
        - { id: credit, label: Revenge for being left off a paper }
      methods:
        - { id: fumes, label: Organophosphate fumes in a sealed glasshouse }
        - { id: oleander, label: Oleander extract in her flask of tea }
        - { id: foxglove, label: Foxglove leaves in her lunch }
        - { id: heat, label: Shutting the vents to cause heatstroke }
    answer: { suspect: wren, motive: data, method: oleander }
    hints:
      - Only one suspect has no alibi for 17:00–17:20 and left a print on the flask.
      - Her journal says why she was going to the journal editors on Monday.
      - Wren Talbot, to stop Odile exposing the falsified data, using oleander extract in the flask.
    solvedText: The case stands.
