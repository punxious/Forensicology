  # ------------------------------------------------------------ statements
  - id: statement-wren
    kind: transcript
    title: Statement — Wren Talbot
    tag: EV-11
    summary: Research assistant. Interviewed Saturday 09:30.
    intro: Interview conducted by DS P. Nandakumar, Saturday 15 June, 09:30. Transcript extract.
    lines:
      - { id: wren-1, speaker: Talbot, text: "I'm Odile's research assistant. Three years now, mostly on the Fennimore fern project." }
      - { id: wren-2, speaker: Talbot, text: "On Friday I was in the glasshouse with her until about half past four, repotting seedlings." }
      - { id: wren-3, speaker: Talbot, text: "She seemed fine. Tired. She always had that flask of lemon verbena tea with her." }
      - { id: wren-4, speaker: Talbot, text: "After I left at half four I didn't hear from Odile again." }
      - { id: wren-5, speaker: Talbot, text: "I went to the library and stayed there writing up, from quarter to five until six. I never left." }
      - { id: wren-6, speaker: Talbot, text: "I pruned the oleander on Wednesday because she asked me to. It was growing over the path." }
      - { id: wren-7, speaker: Talbot, text: "I can't believe she'd be careless with Thornguard. She'd been distracted lately, though." }

  - id: statement-hollis
    kind: transcript
    title: Statement — Hollis Crane
    tag: EV-12
    summary: Director of the Fennimore Botanical Trust. Interviewed Saturday 11:00.
    intro: Interview conducted by DS P. Nandakumar, Saturday 15 June, 11:00. Transcript extract.
    lines:
      - { id: hollis-1, speaker: Crane, text: "Odile and I disagreed about selling the east meadow. It was professional, never personal." }
      - { id: hollis-2, speaker: Crane, text: "I was at the planning committee in town from four o'clock until it closed at a quarter past six." }
      - { id: hollis-3, speaker: Crane, text: "My phone was on silent. I only saw her text — 'Feeling very odd, heart all over the place' — at about twenty past six." }
      - { id: hollis-4, speaker: Crane, text: "The main door code is shared by Odile, Wren and me. Abe has his own code for the grounds team." }
      - { id: hollis-5, speaker: Crane, text: "I gave your officers the code myself. I haven't set foot in the glasshouse since Tuesday." }

  - id: statement-felix
    kind: transcript
    title: Statement — Felix Marchetti
    tag: EV-13
    summary: Nephew and next of kin. Interviewed Saturday 14:15.
    intro: Interview conducted by DS P. Nandakumar, Saturday 15 June, 14:15. Transcript extract.
    lines:
      - { id: felix-1, speaker: F. Marchetti, text: "Aunt Odile and I weren't close. I hadn't seen her in about two years." }
      - { id: felix-2, speaker: F. Marchetti, text: "On Friday I took the train to Kingsmere for a job interview and stayed over with a friend." }
      - { id: felix-3, speaker: F. Marchetti, text: "I know how it looks. I get the cottage. I didn't even know she'd left it to me." }
      - { id: felix-4, speaker: F. Marchetti, text: "I don't know the first thing about plants. Never have." }

  - id: statement-abe
    kind: transcript
    title: Statement — Abe Lindqvist
    tag: EV-14
    summary: Head groundskeeper. Found Dr Marchetti. Interviewed Friday 21:10.
    intro: Interview conducted by PC J. Okafor, Friday 14 June, 21:10. Transcript extract.
    lines:
      - { id: abe-1, speaker: Lindqvist, text: "Thornguard lives in the locked store cupboard. I last used it Monday, on the roses outside. Never indoors." }
      - { id: abe-2, speaker: Lindqvist, text: "Thursday morning, about half eleven, her nephew was in the glasshouse with her. They were having words." }
      - { id: abe-3, speaker: Lindqvist, text: "I found her at about twenty to seven. Door locked, vents shut. I used my own code to get in." }
      - { id: abe-4, speaker: Lindqvist, text: "The canister was on the potting bench with the cap off. It's never kept there." }

